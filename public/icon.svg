<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140c2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="156" y="156" width="200" height="200" rx="40" fill="none" stroke="#00f0ff" stroke-width="16" filter="url(#glow)"/>
  <polygon points="256,196 316,256 256,316 196,256" fill="#ff007f" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glow)"/>
</svg>
